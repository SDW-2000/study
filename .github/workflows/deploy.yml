name: Deploy

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VM
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.GCP_HOST }}
          username: ${{ secrets.GCP_USER }}
          key: ${{ secrets.GCP_SSH_KEY }}
          script: |
            set -e
            cd "$HOME/study"
            if git ls-files --error-unmatch Caddyfile >/dev/null 2>&1; then
              caddy_backup="$(mktemp)"
              cp Caddyfile "$caddy_backup"
              trap 'cp "$caddy_backup" Caddyfile; rm -f "$caddy_backup"' EXIT
              git restore --staged --worktree -- Caddyfile
              git pull --ff-only
              cp "$caddy_backup" Caddyfile
              rm -f "$caddy_backup"
              trap - EXIT
            else
              git pull --ff-only
            fi
            if [ ! -f Caddyfile ]; then
              cp Caddyfile.example Caddyfile
            fi
            docker compose up -d --build
