name: Deploy

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VM
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.GCP_HOST }}
          username: ${{ secrets.GCP_USER }}
          key: ${{ secrets.GCP_SSH_KEY }}
          script: |
            set -e
            cd "$HOME/study"
            caddy_migration_backup=""
            if [ -f Caddyfile ] && ! git ls-files --error-unmatch Caddyfile >/dev/null 2>&1; then
              caddy_migration_backup="$(mktemp)"
              cp Caddyfile "$caddy_migration_backup"
              rm Caddyfile
              trap 'if [ ! -f Caddyfile ]; then cp "$caddy_migration_backup" Caddyfile; fi; rm -f "$caddy_migration_backup"' EXIT
            fi
            git pull --ff-only
            if [ -n "$caddy_migration_backup" ]; then
              rm -f "$caddy_migration_backup"
              trap - EXIT
            fi
            docker compose up -d --build
